
services:
  app:
    build: .
    ports:
      - "5050:5050"
    read_only: true
    secrets:
      - db_password
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: slice_table
      DB_USER: ${DB_USER}
      DB_PASSWORD_FILE: /run/secrets/db_password
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    cap_drop:
      - ALL

  db:
    image: postgres:15-alpine
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: slice_table
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${BD_PASSWD}
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db_data:
secrets:
  db_password:
    file: ./secrets/db_password.txt
